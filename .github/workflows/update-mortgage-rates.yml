name: Update Mortgage Rates

on:
  schedule:
    # Freddie Mac's PMMS survey typically publishes Thursday mornings ET.
    # Run Thursday and Friday afternoons UTC as a safety net in case a
    # holiday shifts the publish day.
    - cron: '0 17 * * 4,5'
  workflow_dispatch: {}

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/update-mortgage-rates.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mortgage-rates.json
          git diff --staged --quiet || git commit -m "Update mortgage rates [skip ci]"
          git push
